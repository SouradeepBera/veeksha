[build-system]
requires = ["setuptools>=68", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "veeksha"
dynamic = ["version"]
description = "A framework for holistic evaluation of LLM Inference Systems"
readme = "README.md"
requires-python = ">=3.14"
license = {text = "Apache-2.0"}
authors = [
    {name = "Vajra Team"},
]
classifiers = [
    "Programming Language :: Python :: 3.14",
    "License :: OSI Approved :: Apache Software License",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "pydantic",
    "transformers",
    "tqdm",
    "ddsketch",
    "wandb",
    "pandas",
    # Capped because librosa pulls in numba, and numba requires numpy<2.5.
    # Left uncapped, a fresh resolve takes numpy 2.5, drops numba to 0.53.1
    # (its metadata declares no upper Python bound), and that pins llvmlite
    # 0.36.0, which refuses to build on anything past 3.9 -- only at build
    # time, so resolution looks clean right up until the install fails.
    # Lift once numba supports numpy 2.5.
    "numpy<2.5",
    "jinja2",
    "datasets",
    "lm-eval>=0.4.11,<0.4.12",
    "evaluate",
    "pytablewriter",
    "Pillow",
    "rekha",
    "textual",
    "textual-plotext",
    "requests",
    "uvloop",
    "httpx",
    "nvidia-ml-py",
    "rich",
    "vidhi",
    "websockets>=14",
    "aiohttp",
    "jiwer",
    "regex",
    "soundfile",
    "librosa",
]

[project.scripts]
veeksha = "veeksha.__main__:main"

[project.urls]
Homepage = "https://github.com/project-vajra/veeksha"
Documentation = "https://project-vajra.github.io/veeksha"

[dependency-groups]
dev = [
    "autoflake",
    "black==25.9.0",
    "codespell",
    "isort==7.0.0",
    "pyright",
    "pytest>=8.0",
    "pytest-cov",
    "requests",
]
test = [
    {include-group = "dev"},
    "rich",
    "jinja2",
]
audio-verification = [
    "faster-whisper",
    "jiwer",
]
utmos = [
    "torch",
    "scipy",
    "soundfile",
    "huggingface_hub",
]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["veeksha*"]
exclude = ["tests*", "docs*"]

[tool.setuptools.package-data]
veeksha = [
    "data/processed_traces/*",
    "data/corpus.txt",
    "dashboard/templates/*",
    "dashboard/static/*",
    "sample_configs/*.yml",
]

[tool.setuptools_scm]
write_to = "veeksha/_version.py"
version_scheme = "post-release"
local_scheme = "no-local-version"

[tool.isort]
profile = "black"
known_first_party = "veeksha"
known_third_party = "wandb"
extend_skip = ["veeksha/_version.py"]

[tool.pyright]
pythonVersion = "3.14"
include = ["veeksha"]
exclude = [
    "**/__pycache__",
    "veeksha/cli/config_docs_generator.py",
]

[tool.uv]
default-groups = ["dev", "test"]

[tool.black]
extend-exclude = 'veeksha/_version\.py'
